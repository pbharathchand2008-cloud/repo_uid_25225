<!DOCTYPE html>
<html>
    <head>
        <title>E-Commerce store</title>
        <style>
            body{
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: grey;
            }
            .container{
                display: grid;
                grid-template-columns:200px 1fr;
                grid-template-rows:auto auto 1fr auto;
                gap:20px;
                padding:20px;
                min-height:100vh;
                grid-template-areas:
                "header header"
                "sale sale"
                "sidebar products"
                "footer footer";
            }
            .header{
                grid-area: header;
                background-color: red;
                color: white;
                padding: 20px;
                text-align: center;
            }
            .sale{
                grid-area: sale;
                background-color:black;
                color: white;
                padding: 20px;
                text-align: center;
            }
            .sidebar{
                grid-area: sidebar;
                background-color: lightgray;
                padding: 20px;
            }
            .sidebar ul{
                list-style:none;padding:0;
            } 
            .sidebar li{
                margin:15px 0;
            } 
            .sidebar a{ 
                color:#fff; 
                text-decoration:none; 
                font-size:18px; 
                transition:.3s; 
            } 
            .sidebar a:hover{
                color:#00ffd5;padding-left:8px;
            } 
            .main{
                grid-area:products;
            } 
           iframe{
                width:100%;
                height:100%;
                border:0;
            }
            .products{
                grid-area: products;
                background-color: white;
                padding: 0;
            }
            .card{
                background-color:red;
                color: white;
                padding: 20px;
                border-radius: 5px;
                text-align:center;
            }
            .button{
                display: inline-block;
                padding: 10px 20px;
                background-color: palevioletred;
                color: white;
                text-decoration: none;
                border-radius: 5px;
                margin-top: 10px;
            }
            .button:hover{
                background-color: plum;
            }
            .footer{
                grid-area: footer;
                background-color: lightgray;
                color: black;
                padding: 20px;
                text-align: center;
            }        

        </style>
    </head>
    <body>
       <div class="container">

                <div class="header">
                    <h1>Welcome to Our E-Commerce Store</h1>
                </div>

                <div class="sale">
                    <h2>Big Sale! Up to 50% Off!</h2>
                </div>

                <div class="sidebar">
                    <h3>Categories</h3>
                    <ul>
                        <li><a href="electronics.html" target="contentFrame">Electronics</a></li>
                        <li><a href="clothings.html" target="contentFrame">Clothing</a></li>
                        <li><a href="home-kitchen.html" target="contentFrame">Home & Kitchen</a></li>
                        <li><a href="books.html" target="contentFrame">Books</a></li>
                    </ul>
                </div>

                <div class="products">
                    <iframe name="contentFrame"></iframe>
                </div>

                <div class="footer">
                    <p>© 2026 My Store</p>
                </div>

            </div>
            </div> 
        </div> 
    </body> 
</html>
