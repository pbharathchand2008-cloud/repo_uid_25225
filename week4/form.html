<!DOCTYPE html>
<html>
<body>

<h2 align="center">College Admission Registration</h2>

<form action="/action_page.php">

<table border="1" cellpadding="10" cellspacing="0" align="center">

<tr>
  <td><label for="fname">First Name:</label></td>
  <td><input type="text" id="fname" name="fname"></td>
</tr>

<tr>
  <td><label for="lname">Last Name:</label></td>
  <td><input type="text" id="lname" name="lname"></td>
</tr>

<tr>
  <td><label for="email">Email:</label></td>
  <td><input type="email" id="email" name="email"></td>
</tr>

<tr>
  <td><label for="phone">Phone:</label></td>
  <td><input type="number" id="phone" name="phone"></td>
</tr>

<tr>
  <td><label for="password">Password:</label></td>
  <td><input type="password" id="password" name="password"></td>
</tr>

<tr>
  <td><label for="date">Date:</label></td>
  <td><input type="date" id="date" name="date"></td>
</tr>

<tr>
  <td>Phone (Radio):</td>
  <td><input type="radio" name="phone"></td>
</tr>

<tr>
  <td>Phone (Checkbox):</td>
  <td><input type="checkbox" name="phone"></td>
</tr>

<tr>
  <td><label for="branch">Branch:</label></td>
  <td>
    <select name="branch" id="branch">
      <option value="">Select</option>
      <option value="IT">IT</option>
      <option value="CSE">CSE</option>
      <option value="AI">AI</option>
    </select>
  </td>
</tr>

<tr>
  <td><label for="message">Message:</label></td>
  <td>
    <textarea id="message" name="message" rows="5" cols="30">
The cat was playing in the garden.
    </textarea>
  </td>
</tr>

<tr>
  <td><label for="browser">Browser:</label></td>
  <td>
    <input list="browsers" name="browser" id="browser">
    <datalist id="browsers">
      <option value="Edge">
      <option value="Firefox">
      <option value="Chrome">
      <option value="Opera">
      <option value="Safari">
    </datalist>
  </td>
</tr>

<tr>
  <td>Calculation:</td>
  <td oninput="x.value=parseInt(a.value)+parseInt(b.value)">
    0
    <input type="range" id="a" name="a" value="50">
    100 +
    <input type="number" id="b" name="b" value="50">
    =
    <output name="x" for="a b"></output>
  </td>
</tr>

<tr>
  <td colspan="2" align="center">
    <input type="submit" value="Submit">
  </td>
</tr>

</table>

</form>

</body>
</html>
