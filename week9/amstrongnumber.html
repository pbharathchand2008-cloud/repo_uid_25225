<!DOCTYPE html>
<html>
<body>
<script>
    let num = parseInt(prompt("Enter a number:"));
    let temp = num;
    let sum = 0;
    let digits = num.toString().length;

    while (temp > 0) {
        let digit = temp % 10;
        sum += Math.pow(digit, digits);
        temp = Math.floor(temp / 10);
    }

    if (sum === num) {
        document.write("Armstrong Number");
    } else {
        document.write("Not an Armstrong Number");
    }
</script>
</body>
</html>
